aid: ugi-corporation
name: UGI Corporation
description: >-
  UGI Corporation (NYSE: UGI) is a King of Prussia, Pennsylvania-based natural
  gas and electric utility and propane distribution company. UGI Utilities
  serves Pennsylvania natural gas and electric customers, AmeriGas is the
  largest retail propane distributor in the United States, and UGI International
  markets LPG across Europe through brands including Antargaz, Flaga, and
  AvantiGas. The corporation also operates midstream and energy marketing
  businesses. No public developer portal, OpenAPI specs, or third-party
  developer APIs have been identified. Customer self-service runs on a Smart
  Energy Water (SEW)-powered Online Account Center (Android package
  com.sew.ugi) with CheckFree Pay handling bill payments; AmeriGas operates the
  separate MyAmeriGas portal at myamerigas.com. Large commercial customers use
  an Oracle APEX-based TCP platform at apex.ugi.com. UGI Utilities is not
  listed as a supported utility by UtilityAPI or other Green Button
  aggregators at the time of profiling.
